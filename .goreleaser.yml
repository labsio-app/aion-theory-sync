version: 2

builds:
  - id: aion-theory-sync
    main: .
    binary: aion-theory-sync
    goos: [windows]
    goarch: [amd64]
    flags:
      - -trimpath

archives:
  - id: aion-theory-sync
    formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  disable: true
