name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds the installable app a member actually downloads: an Inno Setup
  # Setup.exe wrapping the GUI build (cmd/gui), with a Start Menu shortcut,
  # an optional desktop icon and a folder picker. Separate from goreleaser,
  # which stays focused on the raw per-OS binaries/archives: Inno Setup
  # only runs on Windows, and goreleaser has no installer pipe for it.
  windows-installer:
    needs: goreleaser
    runs-on: windows-latest
    permissions:
      contents: write
    # secrets.* is not a valid context inside a step's `if:` (actionlint);
    # computing it once here, through `env:` (where `secrets` is allowed),
    # is the documented workaround every later step's `if:` reads instead.
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Embed the icon and version info as a Windows resource
        run: go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0 -icon=assets/icon.ico -o=cmd/gui/resource_windows_amd64.syso cmd/gui/versioninfo.json
      - name: Build both binaries the installer bundles
        run: |
          go build -trimpath -ldflags "-H=windowsgui" -o build\aion-theory-sync-gui.exe ./cmd/gui
          go build -trimpath -o build\aion-theory-sync.exe .
      - name: Compile the installer
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\aion-theory-sync.iss
      # Inactive until the repository has a SignPath OSS project: SignPath
      # signs the installer for free for open-source projects (see
      # docs/code-signing.md for the one-time account/project setup this
      # step cannot do on its own), which is what stops Windows SmartScreen
      # from flagging the download as untrusted. Skips itself cleanly when
      # SIGNPATH_API_TOKEN is not set, so nothing else in this job depends
      # on it being configured.
      - name: Submit the installer to SignPath for signing
        if: ${{ env.HAS_SIGNPATH == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: installer\aion-theory-sync-setup.exe
          retention-days: 1
        id: upload-unsigned
      - name: Sign the installer
        if: ${{ env.HAS_SIGNPATH == 'true' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "${{ secrets.SIGNPATH_ORGANIZATION_ID }}"
          # TODO once the SignPath project exists (docs/code-signing.md):
          # fill in its actual slugs from the SignPath dashboard.
          project-slug: "aion-theory-sync"
          signing-policy-slug: "release-signing"
          artifact-configuration-slug: "installer"
          github-artifact-id: "${{ steps.upload-unsigned.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: installer-signed
      - name: Replace the installer with its signed copy
        if: ${{ env.HAS_SIGNPATH == 'true' }}
        run: Move-Item -Force installer-signed\aion-theory-sync-setup.exe installer\aion-theory-sync-setup.exe
      - name: Checksum the installer
        run: |
          $hash = (Get-FileHash installer\aion-theory-sync-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  aion-theory-sync-setup.exe" | Out-File -Encoding ascii installer\aion-theory-sync-setup.exe.sha256
      - name: Attach the installer to this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" installer\aion-theory-sync-setup.exe installer\aion-theory-sync-setup.exe.sha256 --clobber
