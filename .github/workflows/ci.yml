name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go build ./...
      - run: go vet ./...
      - run: gofmt -l . | (! grep .)
      - run: go test ./...
      # The only platform this ships for (T3); without this, the DPAPI
      # syscall file (internal/auth/protect_windows.go) is never compiled
      # on this ubuntu runner at all (review finding F23).
      - run: GOOS=windows GOARCH=amd64 go build ./...
      - run: GOOS=windows GOARCH=amd64 go vet ./...
